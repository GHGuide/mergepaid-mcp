[project]
name = "mergepaid-mcp"
version = "0.1.0"
description = "MergePaid supplier MCP server: find paid GitHub jobs, claim with a human tap, submit, get paid."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.scripts]
mergepaid-mcp = "mergepaid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mergepaid_mcp"]

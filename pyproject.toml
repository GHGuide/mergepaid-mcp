[project]
name = "mergepaid-mcp"
version = "0.3.6"
description = "MergePaid racer MCP server: find paid GitHub jobs, claim with a human tap, submit, get paid."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.scripts]
mergepaid-mcp = "mergepaid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tools are isolated from normal connector installs. release-connector.sh
# --certify installs the complete hashed lock, including these build/test tools.
[dependency-groups]
certification = ["hatchling", "pip-audit", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["mergepaid_mcp"]
